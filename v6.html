<script>window.maplibregl||document.write('<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>')</script>
<style>
:root{--bg:#0b0d14;--fg:#eef1f8;--glow:#6ee7ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
#map{position:absolute;inset:0}
.night .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.7)}
#top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px;background:linear-gradient(#0b0d14ee,#0b0d1400);z-index:5}
#top h1{margin:0 0 8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
#top h1 span{color:var(--glow)}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid #ffffff30;background:#12162299;backdrop-filter:blur(8px);color:var(--fg);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.off{opacity:.35}
#bar{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.btn{border:1px solid #6ee7ff66;background:#0b0d14cc;backdrop-filter:blur(8px);color:var(--glow);border-radius:12px;padding:10px 13px;font-size:13px;cursor:pointer;box-shadow:0 0 14px #6ee7ff33}
#todo{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:10px;max-width:360px;max-height:45%;overflow:auto;background:#0b0d14ee;border:1px solid #ffffff25;border-radius:14px;padding:12px;z-index:6;display:none;font-size:13px}
#todo button{display:block;width:100%;text-align:left;margin:4px 0;padding:9px;background:#ffffff10;border:0;border-radius:8px;color:var(--fg);font-size:13px}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 12px #0008,0 0 14px var(--c);background:var(--c);cursor:pointer}
.pin i{transform:rotate(45deg);font-style:normal;font-size:16px}
.pin.unv{border-style:dashed}
.maplibregl-popup-content{background:#12151f;color:var(--fg);border-radius:14px;padding:14px;min-width:230px;font-size:13px;line-height:1.45}
.maplibregl-popup-tip{border-top-color:#12151f!important;border-bottom-color:#12151f!important}
.maplibregl-popup-close-button{color:#fff;font-size:20px}
.pop h3{margin:0 0 4px;font-size:16px}.pop small{opacity:.7}
.pop a,.pop button{color:var(--glow);background:none;border:1px solid #6ee7ff55;border-radius:8px;padding:6px 9px;margin:6px 6px 0 0;font-size:12px;text-decoration:none;cursor:pointer;display:inline-block}
.warn{color:#ffd166}
#side{position:absolute;top:96px;left:10px;bottom:70px;width:310px;overflow:auto;background:#0b0d14ee;backdrop-filter:blur(10px);border:1px solid #ffffff25;border-radius:14px;padding:10px;z-index:5;font-size:13px}
#side.hide{display:none}
#side button{display:block;width:100%;text-align:left;margin:4px 0;padding:9px;background:#ffffff10;border:0;border-radius:8px;color:var(--fg);font-size:13px;cursor:pointer}
#side h4{margin:8px 0}
.it{display:flex;justify-content:space-between;gap:6px;padding:7px 4px;border-bottom:1px solid #ffffff15;cursor:pointer}
.it u{text-decoration:none;padding:0 5px;color:var(--glow)}
#rinfo{margin-top:8px;opacity:.85;line-height:1.5}
#toast{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#0b0d14f0;border:1px solid #6ee7ff66;border-radius:10px;padding:9px 14px;font-size:13px;z-index:9;display:none;max-width:90%}
#todo{left:auto;width:min(360px,calc(100% - 20px))}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #00c2ff;box-shadow:0 0 0 0 #00c2ffaa,0 0 24px #00c2ff;animation:pulse 1.4s infinite}
@keyframes pulse{to{box-shadow:0 0 0 18px #00c2ff00,0 0 24px #00c2ff}}
#modes{display:flex;gap:6px;overflow-x:auto;padding-top:2px;scrollbar-width:none}
#modes .chip{border-color:#6ee7ff66;color:var(--glow)}
.explore #top,.explore #side,.explore #todo,.explore #toast{display:none!important}
.explore #bar .btn:not(#bExplore){display:none}
#bar{right:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.btn{flex:none;white-space:nowrap}
.it{flex-wrap:wrap}
.sat.night .maplibregl-canvas{filter:brightness(.55)}
#ov{position:absolute;inset:0;z-index:20;background:#0b0d14f5;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 80px;display:none}
#ov.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{background:#ffffff0d;border:1px solid #ffffff20;border-radius:12px;padding:10px;font-size:13px}
.card h4{margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #ffffff12}
.row input{background:#ffffff12;border:1px solid #ffffff25;border-radius:6px;color:#fff;padding:3px;font-size:12px}
@media(max-width:700px){#side{top:auto;left:10px;right:10px;width:auto;height:38%;bottom:70px}}
</style>
</head>

function fail(t){const e=document.createElement('div');e.style.cssText='position:absolute;z-index:30;top:120px;left:10px;right:10px;padding:14px;background:#3b1219;border:1px solid #fb7185;border-radius:12px;font-size:14px';e.textContent=t+' (toucher pour fermer)';e.onclick=()=>e.remove();document.body.appendChild(e)}
if(!window.maplibregl){fail('La bibliothèque de carte ne s’est pas chargée : vérifie ta connexion, et ouvre le fichier directement dans Chrome ou Safari, pas dans l’aperçu du chat.');throw new Error('maplibre manquant')}
if(!document.createElement('canvas').getContext('webgl')){fail('WebGL est désactivé sur cet appareil : la 3D ne peut pas s’afficher.');throw new Error('webgl')}
// Style maison : fond clair, eau, parcs, rues, et bâtiments extrudés à partir des données OpenStreetMap (hauteurs réelles)
const SRC='ofm',STYLE={version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
 sources:{ofm:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'© OpenMapTiles © OpenStreetMap contributors · OpenFreeMap'}},
 layers:[
 {id:'bg',type:'background',paint:{'background-color':'#e9edf2'}},
 {id:'green',type:'fill',source:SRC,'source-layer':'landcover',filter:['in',['get','class'],['literal',['grass','wood']]],paint:{'fill-color':'#cfe5c4'}},
 {id:'parks',type:'fill',source:SRC,'source-layer':'park',paint:{'fill-color':'#c3e0b5'}},
 {id:'water',type:'fill',source:SRC,'source-layer':'water',paint:{'fill-color':'#a9cdea'}},
 {id:'roads',type:'line',source:SRC,'source-layer':'transportation',filter:['match',['get','class'],['rail','transit','ferry','aerialway'],false,true],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],11,.4,15,3,18,12]}},

 {id:'streets',type:'symbol',source:SRC,'source-layer':'transportation_name',minzoom:14,layout:{'symbol-placement':'line','text-field':['coalesce',['get','name:latin'],['get','name']],'text-font':['Noto Sans Regular'],'text-size':11},paint:{'text-color':'#4b5565','text-halo-color':'#fff','text-halo-width':1.5}},
 {id:'places',type:'symbol',source:SRC,'source-layer':'place',filter:['in',['get','class'],['literal',['city','suburb','neighbourhood','quarter']]],layout:{'text-field':['coalesce',['get','name:latin'],['get','name']],'text-font':['Noto Sans Regular'],'text-size':13},paint:{'text-color':'#2b3340','text-halo-color':'#fff','text-halo-width':1.8}}
 ]};
const map=new maplibregl.Map({container:'map',style:STYLE,center:[-73.99,40.735],zoom:14.6,pitch:62,bearing:-25,maxPitch:85,attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
let errShown=0;
map.on('error',e=>{const m=(e.error&&e.error.message)||'';if(/fetch|network|load failed|failed/i.test(m)&&!errShown++)fail('Carte : impossible de charger les données ('+m+'). Les tuiles OpenFreeMap sont peut-être bloquées par ton réseau, un bloqueur de pub ou l’aperçu du chat.')});

map.on('load',()=>{
  // Bâtiments 3D extrudés depuis les données OpenStreetMap (hauteurs réelles quand disponibles)
  const src=Object.keys(map.getStyle().sources).find(s=>map.getSource(s).type==='vector');
  if(!map.getLayer('building-3d')){
    map.addLayer({id:'building-3d',type:'fill-extrusion',source:src,'source-layer':'building',minzoom:13,

  } else {

  }
});

const ICON={'Barclays Center':'🏀','American Museum of Natural History':'🦕','9/11 Museum':'🕯️','9/11 Memorial':'🕊️','Grand Central Terminal':'🚉','St. Patrick’s Cathedral':'⛪','New York Public Library':'📚','Times Square':'🎆','Midnight Moment (Times Square)':'🕛','Chelsea Market':'🧺','High Line':'🌿','Bryant Park':'🌲','Winter Village Bryant Park':'⛸️','Shopping 5e Avenue':'🛍️','Shopping SoHo':'👗','Bedford Avenue (Williamsburg)':'🧥','Nolita':'👜','Trump Tower':'🏢','Rockefeller Center':'🎄','Top of the Rock':'🔭','Lotte New York Palace':'🏰','Empire Hotel':'🍸','Marches du MET':'🏛️','SUMMIT One Vanderbilt':'🌃','Central Park':'🌳','Bethesda Terrace':'⛲','Bow Bridge (Central Park)':'🌸','Strawberry Fields':'🍓','Hélicoptère (Downtown Heliport)':'🚁','Staten Island Ferry (Whitehall)':'⛴️','Ferry East River (Pier 11)':'🚢','Charging Bull':'🐂','Pier 17 (Seaport)':'⚓','Brooklyn Bridge — lever du soleil':'🌄','Brooklyn Bridge Park — coucher du soleil':'🌅','DUMBO (Washington Street)':'📸','Manhattan Bridge':'🌉','Pebble Beach (Brooklyn Bridge Park)':'🏖️','Brooklyn Heights Promenade':'🌆','Téléphérique de Roosevelt Island':'🚡','Roosevelt Island (balade)':'🏝️','Williamsburg':'🎨','Domino Park — coucher du soleil':'🌇','Flatiron Building':'🔺','Madison Square Park':'🌷','Empire State Building':'🏙️','Hudson Yards':'🏗️','Edge (Hudson Yards)':'🔝','Little Island':'🌴','Broadway — spectacle':'🎭','Friends — 90 Bedford Street':'🛋️','Constance Billard (Sacred Heart)':'🎓','Chinatown':'🏮','Little Italy':'🇮🇹','Greenwich Village':'🎸','West Village':'🧱','Blue Note':'🎷','Village Vanguard':'🎺','Smalls Jazz Club':'🎹','Mezzrow':'🕯️','Zinc Bar':'🥃',"Arthur's Tavern":'🍻','Cellar Dog':'🐕','230 Fifth Rooftop':'🍹','M Social Times Square Rooftop':'🥂','Pier 57 Rooftop':'🍾','Vélo Central Park (Columbus Circle)':'🚴','Upper East Side':'🧥','Prospect Heights':'🏘️','Park Slope':'🏡','Empire Hotel':'🍸'};
function foodIcon(n){n=String(n);
 if(/shake shack|mcdonald|wendy|burger/i.test(n))return'🍔';
 if(/cane|chick-fil|chicken/i.test(n))return'🍗';
 if(/pizza/i.test(n))return'🍕';
 if(/levain|crumbl|cookie/i.test(n))return'🍪';
 if(/bagel/i.test(n))return'🥯';
 if(/mimi|ice cream/i.test(n))return'🍦';
 if(/gnocchi|pasta|arthur &/i.test(n))return'🍝';
 if(/ikea|hot.?dog/i.test(n))return'🌭';
 if(/juice/i.test(n))return'🧃';
 return'🍴'}
const markers=[],active=new Set(Object.keys(CATS));
function pin(p,extra){
  const c=CATS[p.cat],el=document.createElement('div');
  el.className='pin'+(p.ok?'':' unv');el.style.setProperty('--c',c[2]);el.innerHTML='<i>'+(ICON[p.name]||(p.cat==='f'?foodIcon(p.name):'')||c[0])+'</i>';
  const m=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map);
  p.el=el;p.m=m;
  el.addEventListener('click',e=>{e.stopPropagation();show(p)});
  markers.push(p);return p;
}
function popupHtml(p,i){
  const q=encodeURIComponent(p.name+' New York');
  const gm=p.ok?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${q}`;
  return `<div class="pop"><h3><span onclick="editPos(${i})" style="float:right;font-size:22px;cursor:pointer;margin-left:10px" title="Corriger l’adresse">✏️</span>${ICON[p.name]||(p.cat==='f'?foodIcon(p.name):CATS[p.cat][0])} ${p.name}</h3><small>${p.q||''} · ${CATS[p.cat][1]}</small>
  <p>${p.desc||''}</p>
  ${p.addr?`<p>📍 ${p.addr}</p>`:''}
  <p class="${p.ok?'':'warn'}">${p.ok?'✔ Position vérifiée':'⚠ Position approximative — à vérifier'}</p>
  <a href="${gm}" target="_blank" rel="noopener">Google Maps</a><button onclick="editPos(${i})">✏️ Corriger</button><button onclick="addToDay(${i})">+ Journée</button><button onclick="setA(${i})">Départ A</button><button onclick="routeAB(${i})">Aller ici</button>${p.ok?'':`<button onclick="verify(${i})">Vérifier</button>`}</div>`;
}
let pop;
function show(p){
  const i=markers.indexOf(p);pop&&pop.remove();
  pop=new maplibregl.Popup({offset:38,maxWidth:'300px'}).setLngLat([p.lng,p.lat]).setHTML(popupHtml(p,i)).addTo(map);
  map.flyTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),16.2),pitch:65,duration:1600,essential:true});
}
async function verify(i){
  const p=markers[i];
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=-74.26,40.92,-73.70,40.49&bounded=1&q='+encodeURIComponent((typeof GQ!=='undefined'&&GQ[p.name])||p.geoq||p.name));

// Animation le long du trajet de la journée (ou du dernier trajet A → B)
function follow(){
  if(!lastGeo||!lastGeo.coordinates.length)return toast('Calcule d’abord un trajet : choisis une journée ou utilise « Départ A » / « Aller ici ».');
  stopAll();if(pop)pop.remove();side.classList.add('hide');
  const c=lastGeo.coordinates,n=c.length,dur=Math.min(45000,Math.max(12000,n*60));
  dot=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'dot'})}).setLngLat(c[0]).addTo(map);
  const t0=performance.now();let br=map.getBearing();
  const step=now=>{
    const f=Math.min(1,(now-t0)/dur),i=Math.min(n-2,Math.floor(f*(n-1))),a=c[i],b=c[i+1],u=f*(n-1)-i;
    const pos=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];dot.setLngLat(pos);
    const tg=Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI,d=((tg-br+540)%360)-180;br+=d*.04;
    map.jumpTo({center:pos,bearing:br,pitch:70,zoom:17});
    if(f<1)anim=requestAnimationFrame(step);else{toast('Arrivée !');anim=0}
  };
  anim=requestAnimationFrame(step);
}

async function editPos(i){

  const m=v.match(/^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  let lat,lng,addr=v.trim();
  if(m){lat=+m[1];lng=+m[2];addr='Position saisie à la main'}
  else{
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=-74.26,40.92,-73.70,40.49&bounded=1&q='+encodeURIComponent(v+' New York'));
      const j=await r.json();
      if(!j.length)return toast('Adresse introuvable. Essaie avec les coordonnées copiées depuis Google Maps.');
      lat=+j[0].lat;lng=+j[0].lon;addr=j[0].display_name.split(',').slice(0,3).join(',');
    }catch(e){return toast('Recherche indisponible : utilise des coordonnées.')}
  }
  if(lat<40.4||lat>41||lng<-74.4||lng>-73.6)return toast('Ces coordonnées ne sont pas à New York : vérifie le signe moins devant la longitude.');
  applyPos(p,lat,lng,addr);POS[p.name]=[lat,lng,addr];savePos();show(p);
}

// Restaurants du programme : on choisit la succursale la plus proche du reste de la journée
async function geoNear(q,near){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=10&viewbox=-74.26,40.92,-73.70,40.49&bounded=1&q='+encodeURIComponent(q));
  const j=await r.json();if(!j.length)return null;
  const ref=near?{lat:near[0],lng:near[1]}:HOTEL;
  const b=j.map(x=>({x,d:dist(ref,{lat:+x.lat,lng:+x.lon})})).sort((a,c)=>a.d-c.d)[0].x;
  return [+b.lat,+b.lon,b.display_name.split(',').slice(0,3).join(',')];
}
function insertStop(d,s,p){
  const idx=d.plan.slice(0,d.plan.indexOf(s)).filter(x=>{const m=byName(x.n);return m&&d.pl.includes(m)}).length;
  d.pl.splice(idx,0,p);
}

}
async function parseLoc(v){
  const m=v.match(/^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  if(m)return [+m[1],+m[2],'Position saisie à la main'];
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=-74.26,40.92,-73.70,40.49&bounded=1&q='+encodeURIComponent(v+' New York'));
  const j=await r.json();if(!j.length)return null;
  return [+j[0].lat,+j[0].lon,j[0].display_name.split(',').slice(0,3).join(',')];
}

    const r=await parseLoc(v);if(!r)return toast('Adresse introuvable.');
    ICON[s.n]=foodIcon(s.n);
    const p=pin({name:s.n,cat:'f',lat:r[0],lng:r[1],q:'',addr:r[2],desc:'Adresse saisie à la main.',ok:true});
    POS['res:'+(s.q||s.n)]=r;savePos();insertStop(DAYS[di],s,p);if(cur===di){renderSide();dayRoute()}
  }catch(e){toast('Recherche indisponible.')}
}
const _rs4=renderSide;renderSide=function(m){
  _rs4(m);if(cur==null)return;
  const ri=document.getElementById('rinfo');if(!ri)return;
  const un=DAYS[cur].plan.map((s,k)=>({s,k})).filter(o=>o.s.q&&!byName(o.s.n));if(!un.length)return;
  const t=document.createElement('div');
  t.innerHTML=un.map(o=>`<div class="it"><span>${foodIcon(o.s.n)} ${o.s.t||''} ${o.s.n} <small class="warn">adresse à trouver…</small></span><span><u onclick="fixStop(${cur},${o.k})">✏️</u></span></div>`).join('');
  ri.parentNode.insertBefore(t,ri);
};
const _sd2=selDay;selDay=function(i){_sd2(i);resolveDay(i)};

// Panneau FOOD : sous-sections par type de plat, avec logo
const FOODS=[
['Burgers','🍔',[['Shake Shack'],['McDonald’s'],['Wendy’s']]],
['Poulet','🍗',[['Raising Cane’s'],['Chick-fil-A']]],
['Pizza','🍕',[['Ray’s Pizza'],['Joe’s Pizza'],['Pizza à 1,50 $','$1 pizza']]],
['Cookies & douceurs','🍪',[['Levain Bakery'],['Crumbl']]],
['Bagels','🥯',[['Apollo Bagels'],['Leon’s Bagels']]],
['Glaces','🍦',[['Mimi’s']]],
['Pâtes & italien','🍝',[['Gnocchi on 9th'],['Pasta de Pasta'],['Arthur & Sons']]],
['Hot-dog','🌭',[['IKEA (hot-dog)','IKEA Brooklyn']]],
['Jus & café','🧃',[['Joe & The Juice']]]
];
function foodPanel(){
  cur=null;side.classList.remove('hide');
  side.innerHTML='<button onclick="back()">← Journées</button><h4>🍴 Food</h4><small style="opacity:.7">Touche « Trouver » : les vraies adresses apparaissent sur la carte (autour de toi si ta position est active).</small>'+
  FOODS.map((g,gi)=>`<h4>${g[1]} ${g[0]}</h4>`+g[2].map((r,j)=>`<div class="it"><span>${g[1]} ${r[0]}</span><span><u onclick="findFood(${gi},${j})">📍 Trouver</u></span></div>`).join('')).join('');
}
async function findFood(gi,j){
  const g=FOODS[gi],r=g[2][j],q=(r[1]||r[0]).replace(/’/g,"'");
  toast('Recherche : '+r[0]+'…');
  const vb=userPos?`${userPos[0]-.04},${userPos[1]+.03},${userPos[0]+.04},${userPos[1]-.03}`:'-74.26,40.92,-73.70,40.49';
  try{
    const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=10&viewbox='+vb+'&bounded=1&q='+encodeURIComponent(q));
    let js=await res.json();
    if(!js.length)return toast('Aucune adresse trouvée pour '+r[0]+'.');
    if(userPos){const me={lat:userPos[1],lng:userPos[0]};js=js.sort((a,b)=>dist(me,{lat:+a.lat,lng:+a.lon})-dist(me,{lat:+b.lat,lng:+b.lon})).slice(0,6)}
    ICON[r[0]]=g[1];
    js.forEach(x=>foodMk.push(pin({name:r[0],cat:'f',lat:+x.lat,lng:+x.lon,q:g[0],addr:x.display_name.split(',').slice(0,3).join(','),desc:g[0],ok:true})));
    const bb=new maplibregl.LngLatBounds();js.forEach(x=>bb.extend([+x.lon,+x.lat]));
    map.fitBounds(bb,{padding:80,maxZoom:15.5,pitch:55,duration:1500});
    toast(js.length+' adresse(s) pour '+r[0]+'.');
  }catch(e){toast('Recherche indisponible (service gratuit saturé ?).')}
}
// Les adresses food ne sont plus dans « À localiser » : elles sont dans l'onglet Food
[...todo.querySelectorAll('button')].filter(b=>b.textContent.startsWith('🍔')).forEach(b=>b.remove());

// Panneau ACTIVITÉS : chaque activité avec son propre logo
function actPanel(){
  cur=null;side.classList.remove('hide');
  const list=markers.filter(p=>!p.tmp&&p.cat!=='f'&&p.cat!=='h'&&!foodMk.includes(p));
  side.innerHTML='<button onclick="back()">← Journées</button><h4>🎯 Activités</h4>'+list.map(p=>`<div class="it" onclick="show(markers[${markers.indexOf(p)}])"><span>${ICON[p.name]||CATS[p.cat][0]} ${p.name} ${badge(STATUS[p.name])}</span></div>`).join('');
}
bFood.onclick=foodPanel;bAct.onclick=actPanel;
